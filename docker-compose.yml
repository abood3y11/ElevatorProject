services:
  db:
    image: postgres:16-alpine
    container_name: elms-db
    environment:
      POSTGRES_DB: elms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elms_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: elms-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elms-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "True"
      ENVIRONMENT: development
      # Admin connection: alembic and admin scripts. Owns the tables, bypasses
      # row-level security.
      DATABASE_URL: postgresql://postgres:admin@db:5432/elms_db
      # Runtime connection: the non-superuser elms_app role, which the 117
      # tenant_isolation policies actually bind (SaaS spec 2.5). Unset here
      # because the password is not committed - create the role with
      #   python backend/scripts/setup_tenant_role.py
      # and pass the URL through the environment. While it is unset the app
      # falls back to DATABASE_URL and warns that isolation is NOT enforced.
      APP_DATABASE_URL: ${APP_DATABASE_URL:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8081,http://localhost:19006
      JWT_SECRET_KEY: super-secret-key-change-in-production
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elms-worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "True"
      ENVIRONMENT: development
      # Admin connection: alembic and admin scripts. Owns the tables, bypasses
      # row-level security.
      DATABASE_URL: postgresql://postgres:admin@db:5432/elms_db
      # Runtime connection: the non-superuser elms_app role (SaaS spec 2.5).
      # The worker needs this at least as much as the api does - the 17
      # scheduled jobs scan the whole database, so they are the largest
      # cross-tenant leak surface in the system.
      APP_DATABASE_URL: ${APP_DATABASE_URL:-}
      JWT_SECRET_KEY: super-secret-key-change-in-production
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: python -m app.workers.redis_worker

  frontend:
    build:
      context: ./AdminPortal
      dockerfile: Dockerfile
    container_name: elms-admin-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./AdminPortal:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
  redis_data:
